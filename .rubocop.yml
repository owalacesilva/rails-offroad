# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# O omakase já carrega rubocop-performance e rubocop-rails; aqui somamos os cops de RSpec.
plugins:
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "storage/**/*"
    - "vendor/**/*"

# Descrições de exemplo são em português; o cop assume inglês ("should ...").
RSpec/ExampleWording:
  Enabled: false

# Mesmo motivo: os prefixos de context seguem a língua dos specs.
RSpec/ContextWording:
  Prefixes:
    - com
    - sem
    - quando

# Specs de request/helper deste projeto agrupam por cenário, não por classe.
RSpec/DescribeClass:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 10
