### Detectores de code smell.
### Rodar com: docker compose exec web bundle exec reek app lib
### Sem paths explícitos o reek lê da STDIN e não analisa nada.

exclude_paths:
  - db
  - log
  - node_modules
  - storage
  - tmp
  - vendor

detectors:
  # Reek exige comentário de documentação em toda classe/módulo; este projeto
  # documenta o que não é óbvio, não tudo.
  IrresponsibleModule:
    enabled: false

  # Incompatível com o modelo do Rails: toda action popula as ivars que a view
  # consome, e o detector lê isso como estado assumido. Sempre falso positivo aqui.
  InstanceVariableAssumption:
    enabled: false

  # Detector mantido ligado para models e futuros service objects. As exceções
  # abaixo são contêineres de função pura por natureza — helper de view, query
  # object e resolução de locale não têm estado de instância para usar, e forçar
  # isso só pioraria o desenho.
  UtilityFunction:
    exclude:
      - "ApplicationController#supported_locale"
      - "ApplicationController#default_url_options"
      - "ListingFilter"
      - "ListingsHelper"

  # Quatro critérios de filtro mais o scope: 5 ivars é o mínimo desta classe.
  TooManyInstanceVariables:
    exclude:
      - "ListingFilter"
