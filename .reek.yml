### Detectores de code smell.
### Rodar com: docker compose exec web bundle exec reek app lib
### Sem paths explícitos o reek lê da STDIN e não analisa nada.

exclude_paths:
  - db
  - log
  - node_modules
  - storage
  - tmp
  - vendor

detectors:
  # Reek exige comentário de documentação em toda classe/módulo; este projeto
  # documenta o que não é óbvio, não tudo.
  IrresponsibleModule:
    enabled: false

  # Incompatível com o modelo do Rails: toda action popula as ivars que a view
  # consome, e o detector lê isso como estado assumido. Sempre falso positivo aqui.
  InstanceVariableAssumption:
    enabled: false

  # Desligado depois de uma tentativa honesta de mantê-lo com exceções: ao longo
  # do projeto ele apontou seis métodos — helper de view, query object, resolução
  # de locale e um gerador de PNG — e nenhum era defeito de verdade. Método puro
  # sem estado de instância é bom desenho em Ruby, não um smell; uma lista de
  # exceções que só cresce deixa de informar qualquer coisa.
  UtilityFunction:
    enabled: false

  # Action de controller canônica (carrega, monta, salva, notifica, responde)
  # tem ~6 statements. O default 5 reprova o padrão do próprio framework.
  TooManyStatements:
    max_statements: 7

  # Controller conta ivars de todas as actions somadas, mas cada action usa só
  # as suas. AdFilter tem quatro critérios de filtro mais o scope, e o dashboard
  # e a home montam uma página inteira em uma action só — a home tem seis seções.
  TooManyInstanceVariables:
    exclude:
      - "AdFilter"
      - "AdsController"
      - "Dashboard::DashboardController"
      - "HomeController"

  # Ad é o modelo central do portal e concentra as regras de quatro assuntos:
  # moderação, fotos, dinheiro e slug. Quebrá-lo em concerns só para caber no
  # limite espalharia por quatro arquivos o que hoje se lê de uma vez.
  TooManyMethods:
    exclude:
      - "Ad"
