name: offroad_classifieds

# Variáveis vêm do .env (veja .env-example). Todas têm default, então o ambiente
# sobe sem .env. Endereços internos (db/minio/mailhog) são fixos aqui de propósito:
# valem dentro da rede do Compose e não podem ser sobrescritos pelo host.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      # $$ vira $ no container: a senha é lida do ambiente do mysql, não
      # interpolada pelo Compose.
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Com usuário e senha definidos o phpMyAdmin usa auth_type "config":
      # entra direto, sem tela de login. Só para desenvolvimento.
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 256M
    ports:
      - "${PHPMYADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-offroad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-offroad123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: cria o bucket e libera leitura anônima para as URLs de imagem
  # funcionarem direto no navegador em desenvolvimento. Sai assim que termina.
  minio_setup:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-offroad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-offroad123}
      MINIO_BUCKET: ${MINIO_BUCKET:-offroad-classifieds-dev}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$$MINIO_BUCKET" &&
        mc anonymous set download local/"$$MINIO_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    logging:
      driver: json-file
      options:
        max-size: "10m"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/dev
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-offroad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-offroad123}
      MINIO_BUCKET: ${MINIO_BUCKET:-offroad-classifieds-dev}
      SMTP_ADDRESS: mailhog
      SMTP_PORT: 1025
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      BINDING: "0.0.0.0"
      # Redes sociais do rodapé. Default vazio de propósito: sem o endereço no
      # .env o ícone não aparece, em vez de aparecer levando a lugar nenhum.
      SOCIAL_INSTAGRAM_URL: ${SOCIAL_INSTAGRAM_URL:-}
      SOCIAL_YOUTUBE_URL: ${SOCIAL_YOUTUBE_URL:-}
      SOCIAL_FACEBOOK_URL: ${SOCIAL_FACEBOOK_URL:-}
      SOCIAL_WHATSAPP_URL: ${SOCIAL_WHATSAPP_URL:-}
      # Login por provedor (lib/oauth_provider.rb). Default vazio de propósito:
      # sem as duas variáveis do par, o botão não aparece e a rota não existe.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Pagamento do Premium (lib/pagseguro.rb). Default vazio de propósito: sem
      # o token não há assinatura, e a rota devolve 404 em vez de tentar cobrar.
      # O ambiente cai em sandbox quando não é dito — errar aqui não pode virar
      # cobrança de verdade.
      PAGSEGURO_TOKEN: ${PAGSEGURO_TOKEN:-}
      PAGSEGURO_ENV: ${PAGSEGURO_ENV:-sandbox}
    volumes:
      - .:/app
      - bundle:/bundle
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      minio_setup:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  minio_data:
  # Gems ficam num volume, fora do bind mount do projeto.
  # Em um clone novo, rode uma vez: docker compose run --rm web bundle install
  bundle:
