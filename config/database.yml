# MySQL. Versions 8.0.16 and up are supported — as chaves primárias UUID moram em
# VARCHAR(36) e as CHECK constraints do schema só existem a partir do 8.0.16.
#
# Install the MySQL driver:
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
# gem "mysql2"
#
# And be sure to use new-style password hashing:
#   https://dev.mysql.com/doc/refman/5.7/en/password-hashing.html
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Em desenvolvimento o MySQL roda no container "db" (ver compose.yaml).
  # Fora do Docker, os defaults abaixo apontam para um MySQL local.
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "root") %>

development:
  <<: *default
  database: offroad_classifieds_development

  # Connect on a TCP socket. If your MySQL server is running on another
  # machine, or on a non-standard port, uncomment and adjust.
  #host: localhost
  #port: 3306

  # Conexão por socket Unix, quando o MySQL roda na mesma máquina:
  #socket: /var/run/mysqld/mysqld.sock

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: offroad_classifieds_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="mysql2://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="mysql2://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary: &primary_production
    <<: *default
    database: offroad_classifieds_production
    username: offroad_classifieds
    password: <%= ENV["OFFROAD_CLASSIFIEDS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: offroad_classifieds_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: offroad_classifieds_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: offroad_classifieds_production_cable
    migrations_paths: db/cable_migrate
