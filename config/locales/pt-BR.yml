  # Só os formatos da agenda de eventos. default, short e long continuam vindo
  # da gem rails-i18n: o I18n mescla os dois arquivos em vez de substituir.
  date:
    formats:
      event_day: "%-d de %B"
      # Intervalo sai numérico dos dois lados ("12/09 a 14/09"): é curto e não
      # depende da ordem das palavras, que muda de idioma para idioma.
      event_range_day: "%-d/%m"
      event_card_day: "%-d"
      event_card_month: "%b"

